<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tuana'nın Macerası - 2D Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #111827;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            background: #5c94fc;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls-overlay {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
            z-index: 10;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 26px;
            pointer-events: auto;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        
        /* Mobil Dikey Ekran Uyarısı */
        #orient-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f172a;
            z-index: 999;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 768px) and (orientation: portrait) {
            #orient-warning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="orient-warning">
        <h2>📱 Lütfen Telefonu Yan Çevirin</h2>
        <p style="margin-top: 10px; color: #94a3b8;">Daha iyi bir oyun deneyimi için cihazınızı yan tutun.</p>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="controls-overlay">
            <div class="btn-group">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
            <div class="touch-btn" id="btn-jump">▲</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Web Audio API Sentezleyici
class SoundFX {
    constructor() {
        this.ctx = null;
    }
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    playJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }
    playCoin() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }
    playDeath() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
    playWin() {
        if (!this.ctx) return;
        const notes = [400, 500, 600, 800];
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.1);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.1);
            osc.start(this.ctx.currentTime + idx * 0.1);
            osc.stop(this.ctx.currentTime + idx * 0.1 + 0.1);
        });
    }
}

const sound = new SoundFX();

// Oyun Durum Değişkenleri
let currentLevel = 1;
let totalLevels = 5;
let score = 0;
let lives = 3;
let gameState = 'PLAYING'; // PLAYING, LEVEL_CLEAR, GAME_OVER, WIN
let levelClearTimer = 0;

// Admin Hile Kombinasyonu Yönetimi (3 Sağa, 3 Sola, 3 Yukarı)
const adminCode = ['RIGHT', 'RIGHT', 'RIGHT', 'LEFT', 'LEFT', 'LEFT', 'UP', 'UP', 'UP'];
let inputBuffer = [];
let adminNoticeTimer = 0;

function checkAdminCode(action) {
    inputBuffer.push(action);
    if (inputBuffer.length > adminCode.length) {
        inputBuffer.shift();
    }
    
    // Kombinasyon eşleşti mi kontrol et
    if (inputBuffer.length === adminCode.length) {
        let isMatch = true;
        for (let i = 0; i < adminCode.length; i++) {
            if (inputBuffer[i] !== adminCode[i]) {
                isMatch = false;
                break;
            }
        }
        if (isMatch) {
            triggerAdminSkip();
            inputBuffer = [];
        }
    }
}

function triggerAdminSkip() {
    sound.playWin();
    adminNoticeTimer = 120; // Hile bildirim metni süresi
    if (currentLevel < totalLevels) {
        currentLevel++;
        loadLevel(currentLevel);
        gameState = 'PLAYING';
    } else {
        gameState = 'WIN';
    }
}

// Tuş Kontrolleri
const keys = {
    left: false,
    right: false,
    jump: false
};

window.addEventListener('keydown', e => {
    sound.init();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (!keys.left) checkAdminCode('LEFT');
        keys.left = true;
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (!keys.right) checkAdminCode('RIGHT');
        keys.right = true;
    }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
        if (!keys.jump) {
            checkAdminCode('UP');
            if (player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
                sound.playJump();
            }
        }
        keys.jump = true;
    }
    if (e.key === 'r' || e.key === 'R') {
        if (gameState === 'GAME_OVER' || gameState === 'WIN') {
            resetGame();
        }
    }
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
});

// Dokunmatik Kontroller
const bindTouch = (id, keyName, codeAction) => {
    const btn = document.getElementById(id);
    const startHandler = (e) => {
        e.preventDefault();
        sound.init();
        if (gameState === 'GAME_OVER' || gameState === 'WIN') {
            resetGame();
            return;
        }
        checkAdminCode(codeAction);
        if (keyName === 'jump') {
            if (!keys.jump && player.grounded) {
                player.vy = player.jumpStrength;
                player.grounded = false;
                sound.playJump();
            }
        }
        keys[keyName] = true;
    };
    const endHandler = (e) => {
        e.preventDefault();
        keys[keyName] = false;
    };
    btn.addEventListener('touchstart', startHandler);
    btn.addEventListener('touchend', endHandler);
    btn.addEventListener('mousedown', startHandler);
    btn.addEventListener('mouseup', endHandler);
};

bindTouch('btn-left', 'left', 'LEFT');
bindTouch('btn-right', 'right', 'RIGHT');
bindTouch('btn-jump', 'jump', 'UP');

// Karakter (Tuana)
const player = {
    x: 50,
    y: 300,
    width: 28,
    height: 40,
    vx: 0,
    vy: 0,
    speed: 4,
    gravity: 0.5,
    jumpStrength: -10.5,
    grounded: false,
    facing: 'right',
    animFrame: 0,
    reset(x = 50, y = 300) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
    }
};

// Bölüm Haritaları
let platforms = [];
let coins = [];
let hazards = [];
let exitFlag = { x: 0, y: 0, width: 30, height: 60 };
let floatingTexts = [];

function loadLevel(lvl) {
    platforms = [];
    coins = [];
    hazards = [];
    floatingTexts = [];

    if (lvl === 1) {
        player.reset(50, 300);
        platforms = [
            { x: 0, y: 400, width: 300, height: 50, type: 'ground' },
            { x: 350, y: 350, width: 120, height: 20, type: 'wood' },
            { x: 520, y: 300, width: 120, height: 20, type: 'wood' },
            { x: 680, y: 250, width: 250, height: 200, type: 'ground' }
        ];
        coins = [
            { x: 200, y: 360, collected: false },
            { x: 400, y: 310, collected: false },
            { x: 570, y: 260, collected: false },
            { x: 730, y: 210, collected: false }
        ];
        exitFlag = { x: 860, y: 190, width: 30, height: 60 };
    } 
    else if (lvl === 2) {
        player.reset(40, 300);
        platforms = [
            { x: 0, y: 380, width: 150, height: 70, type: 'ground' },
            { x: 200, y: 320, width: 100, height: 20, type: 'moving', dx: 1.5, minX: 180, maxX: 340 },
            { x: 380, y: 260, width: 100, height: 20, type: 'wood' },
            { x: 520, y: 220, width: 100, height: 20, type: 'moving', dx: -1.5, minX: 480, maxX: 640 },
            { x: 680, y: 180, width: 200, height: 270, type: 'ground' },
            { x: 150, y: 430, width: 530, height: 20, type: 'lava' }
        ];
        hazards = [
            { x: 415, y: 245, width: 30, height: 15 }
        ];
        coins = [
            { x: 250, y: 280, collected: false },
            { x: 430, y: 210, collected: false },
            { x: 570, y: 170, collected: false }
        ];
        exitFlag = { x: 800, y: 120, width: 30, height: 60 };
    } 
    else if (lvl === 3) {
        player.reset(40, 200);
        platforms = [
            { x: 0, y: 250, width: 100, height: 200, type: 'ground' },
            { x: 140, y: 300, width: 70, height: 20, type: 'wood' },
            { x: 250, y: 350, width: 70, height: 20, type: 'moving', dx: 2, minX: 230, maxX: 380 },
            { x: 430, y: 280, width: 60, height: 20, type: 'wood' },
            { x: 530, y: 220, width: 60, height: 20, type: 'moving', dx: -2, minX: 500, maxX: 650 },
            { x: 700, y: 160, width: 180, height: 300, type: 'ground' },
            { x: 0, y: 440, width: 900, height: 20, type: 'lava' }
        ];
        hazards = [
            { x: 155, y: 285, width: 30, height: 15 },
            { x: 445, y: 265, width: 30, height: 15 }
        ];
        coins = [
            { x: 175, y: 250, collected: false },
            { x: 310, y: 300, collected: false },
            { x: 460, y: 230, collected: false },
            { x: 590, y: 170, collected: false }
        ];
        exitFlag = { x: 800, y: 100, width: 30, height: 60 };
    }
    else if (lvl === 4) {
        player.reset(30, 350);
        platforms = [
            { x: 0, y: 400, width: 90, height: 50, type: 'ground' },
            { x: 130, y: 340, width: 50, height: 20, type: 'wood' },
            { x: 220, y: 280, width: 50, height: 20, type: 'moving', dx: 2.2, minX: 200, maxX: 360 },
            { x: 400, y: 220, width: 50, height: 20, type: 'wood' },
            { x: 490, y: 280, width: 50, height: 20, type: 'moving', dx: -2.2, minX: 470, maxX: 630 },
            { x: 670, y: 200, width: 150, height: 250, type: 'ground' },
            { x: 0, y: 440, width: 900, height: 20, type: 'lava' }
        ];
        hazards = [
            { x: 140, y: 325, width: 30, height: 15 },
            { x: 410, y: 205, width: 30, height: 15 }
        ];
        coins = [
            { x: 155, y: 290, collected: false },
            { x: 280, y: 230, collected: false },
            { x: 425, y: 170, collected: false },
            { x: 550, y: 230, collected: false }
        ];
        exitFlag = { x: 760, y: 140, width: 30, height: 60 };
    }
    else if (lvl === 5) {
        player.reset(30, 380);
        platforms = [
            { x: 0, y: 420, width: 80, height: 30, type: 'ground' },
            { x: 110, y: 360, width: 45, height: 18, type: 'wood' },
            { x: 190, y: 300, width: 45, height: 18, type: 'moving', dx: 2.5, minX: 180, maxX: 320 },
            { x: 350, y: 240, width: 45, height: 18, type: 'wood' },
            { x: 430, y: 180, width: 45, height: 18, type: 'moving', dx: -2.5, minX: 420, maxX: 580 },
            { x: 610, y: 130, width: 45, height: 18, type: 'wood' },
            { x: 690, y: 180, width: 150, height: 300, type: 'ground' },
            { x: 0, y: 440, width: 900, height: 20, type: 'lava' }
        ];
        hazards = [
            { x: 118, y: 345, width: 28, height: 15 },
            { x: 358, y: 225, width: 28, height: 15 },
            { x: 618, y: 115, width: 28, height: 15 }
        ];
        coins = [
            { x: 130, y: 310, collected: false },
            { x: 250, y: 250, collected: false },
            { x: 370, y: 190, collected: false },
            { x: 500, y: 130, collected: false },
            { x: 630, y: 80, collected: false }
        ];
        exitFlag = { x: 770, y: 120, width: 30, height: 60 };
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    currentLevel = 1;
    gameState = 'PLAYING';
    loadLevel(currentLevel);
}

// Çarpışma Kontrol Fonksiyonları
function checkRectCollision(r1, r2) {
    return r1.x < r2.x + r2.width &&
           r1.x + r1.width > r2.x &&
           r1.y < r2.y + r2.height &&
           r1.y + r1.height > r2.y;
}

function checkCircleRectCollision(circle, rect) {
    let closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
    let closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));

    let distanceX = circle.x - closestX;
    let distanceY = circle.y - closestY;

    return (distanceX * distanceX + distanceY * distanceY) < (circle.r * circle.r);
}

function die() {
    sound.playDeath();
    lives--;
    if (lives <= 0) {
        gameState = 'GAME_OVER';
    } else {
        loadLevel(currentLevel);
    }
}

// Güncelleme Döngüsü
function update() {
    if (gameState !== 'PLAYING') return;

    if (adminNoticeTimer > 0) adminNoticeTimer--;

    // Yatay Hareket
    if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
    } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
    } else {
        player.vx = 0;
    }

    // Yerçekimi
    player.vy += player.gravity;

    // Hareketli Platformlar
    platforms.forEach(p => {
        if (p.type === 'moving') {
            p.x += p.dx;
            if (p.x <= p.minX || p.x + p.width >= p.maxX) {
                p.dx *= -1;
            }
        }
    });

    // Yatay Çarpışma
    player.x += player.vx;
    platforms.forEach(p => {
        if (p.type === 'lava') return;
        if (checkRectCollision(player, p)) {
            if (player.vx > 0) player.x = p.x - player.width;
            else if (player.vx < 0) player.x = p.x + p.width;
        }
    });

    // Dikey Çarpışma
    player.y += player.vy;
    player.grounded = false;

    platforms.forEach(p => {
        if (checkRectCollision(player, p)) {
            if (p.type === 'lava') {
                die();
                return;
            }
            if (player.vy > 0 && (player.y + player.height - player.vy) <= p.y + 12) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.grounded = true;
                if (p.type === 'moving') {
                    player.x += p.dx;
                }
            } else if (player.vy < 0) {
                player.y = p.y + p.height;
                player.vy = 0;
            }
        }
    });

    // Haritadan Düşme
    if (player.y > canvas.height + 50) {
        die();
    }

    // Coin Toplama
    coins.forEach(c => {
        if (!c.collected) {
            let coinCircle = { x: c.x, y: c.y, r: 10 };
            if (checkCircleRectCollision(coinCircle, player)) {
                c.collected = true;
                score += 100;
                sound.playCoin();
                floatingTexts.push({
                    text: '+100',
                    x: c.x,
                    y: c.y,
                    alpha: 1,
                    vy: -1
                });
            }
        }
    });

    // Diken/Tehlike Çarpışması
    hazards.forEach(h => {
        if (checkRectCollision(player, h)) {
            die();
        }
    });

    // Bölüm Sonu Bayrak Kontrolü
    if (checkRectCollision(player, exitFlag)) {
        sound.playWin();
        if (currentLevel < totalLevels) {
            gameState = 'LEVEL_CLEAR';
            levelClearTimer = 80;
        } else {
            gameState = 'WIN';
        }
    }

    // Yüzen Metinler
    floatingTexts.forEach((ft, index) => {
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(index, 1);
    });

    if (Math.abs(player.vx) > 0) player.animFrame += 0.2;
}

// Çizim Döngüsü
function draw() {
    // Arka Plan
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Bulutlar
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(100, 80, 25, 0, Math.PI * 2);
    ctx.arc(130, 70, 35, 0, Math.PI * 2);
    ctx.arc(160, 80, 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(500, 100, 20, 0, Math.PI * 2);
    ctx.arc(525, 90, 30, 0, Math.PI * 2);
    ctx.arc(550, 100, 20, 0, Math.PI * 2);
    ctx.fill();

    // Platformlar
    platforms.forEach(p => {
        if (p.type === 'ground') {
            ctx.fillStyle = '#48a028';
            ctx.fillRect(p.x, p.y, p.width, 10);
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(p.x, p.y + 10, p.width, p.height - 10);
        } else if (p.type === 'wood' || p.type === 'moving') {
            ctx.fillStyle = p.type === 'moving' ? '#d97706' : '#b45309';
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.width, p.height);
        } else if (p.type === 'lava') {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(p.x, p.y, p.width, p.height);
        }
    });

    // Dikenler
    hazards.forEach(h => {
        ctx.fillStyle = '#9ca3af';
        ctx.beginPath();
        ctx.moveTo(h.x, h.y + h.height);
        ctx.lineTo(h.x + h.width / 2, h.y);
        ctx.lineTo(h.x + h.width, h.y + h.height);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#4b5563';
        ctx.stroke();
    });

    // Coinler
    coins.forEach(c => {
        if (!c.collected) {
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(c.x, c.y, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ca8a04';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(c.x - 3, c.y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Bitiş Bayrağı
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(exitFlag.x, exitFlag.y, 6, exitFlag.height);
    ctx.fillStyle = '#22c55e';
    ctx.beginPath();
    ctx.moveTo(exitFlag.x + 6, exitFlag.y);
    ctx.lineTo(exitFlag.x + exitFlag.width, exitFlag.y + 15);
    ctx.lineTo(exitFlag.x + 6, exitFlag.y + 30);
    ctx.closePath();
    ctx.fill();

    // TUANA Karakteri
    ctx.save();
    let px = player.x;
    let py = player.y;

    // Kıyafet
    ctx.fillStyle = '#ec4899';
    ctx.fillRect(px + 4, py + 14, 20, 16);

    // Yüz
    ctx.fillStyle = '#fed7aa';
    ctx.fillRect(px + 6, py + 4, 16, 12);

    // Saç
    ctx.fillStyle = '#78350f';
    ctx.fillRect(px + 4, py + 2, 20, 6);
    ctx.fillRect(px + (player.facing === 'right' ? 2 : 18), py + 6, 8, 12);

    // Göz
    ctx.fillStyle = '#000';
    let eyeX = player.facing === 'right' ? px + 16 : px + 8;
    ctx.fillRect(eyeX, py + 8, 3, 3);

    // Bacaklar
    ctx.fillStyle = '#1e3a8a';
    let legOffset = Math.sin(player.animFrame) * 4;
    if (!player.grounded) legOffset = 4;
    ctx.fillRect(px + 6, py + 30, 6, 10 - legOffset);
    ctx.fillRect(px + 16, py + 30, 6, 10 + legOffset);

    // TUANA İsmi
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    let nameX = px + player.width / 2;
    let nameY = py - 12;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(nameX - 25, nameY - 11, 50, 15);
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 1;
    ctx.strokeRect(nameX - 25, nameY - 11, 50, 15);

    ctx.fillStyle = '#facc15';
    ctx.fillText('TUANA', nameX, nameY);

    ctx.restore();

    // Yüzen Skolar
    floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    });

    // Üst Panel
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, canvas.width, 40);

    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(`BÖLÜM: ${currentLevel}/${totalLevels}`, 20, 25);
    ctx.fillText(`SKOR: ${score}`, 200, 25);

    ctx.fillStyle = '#ef4444';
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '❤️ ';
    ctx.fillText(`CAN: ${hearts}`, 650, 25);

    // Admin Hile Bildirimi
    if (adminNoticeTimer > 0) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⚡ ADMİN HİLESİ: SONRAKİ BÖLÜME GEÇİLDİ! ⚡', canvas.width / 2, 25);
    }

    // Durum Ekranları
    if (gameState === 'LEVEL_CLEAR') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`BÖLÜM ${currentLevel} TAMAMLANDI!`, canvas.width / 2, canvas.height / 2);

        levelClearTimer--;
        if (levelClearTimer <= 0) {
            currentLevel++;
            loadLevel(currentLevel);
            gameState = 'PLAYING';
        }
    } else if (gameState === 'GAME_OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('OYUN BİTTİ', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText('Yeniden Başlamak İçin Dokunun veya "R" Tuşuna Basın', canvas.width / 2, canvas.height / 2 + 30);
    } else if (gameState === 'WIN') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 38px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('TEBRİKLER! OYUNU KAZANDIN!', canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`Tuana Tüm 5 Bölümü Başarıyla Tamamladı!`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText(`Toplam Skor: ${score}`, canvas.width / 2, canvas.height / 2 + 45);
        ctx.font = '16px sans-serif';
        ctx.fillStyle = '#9ca3af';
        ctx.fillText('Tekrar Oynamak İçin Dokunun veya "R" Tuşuna Basın', canvas.width / 2, canvas.height / 2 + 85);
    }
}

// Oyun Döngüsü
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Oyunu Başlat
loadLevel(currentLevel);
gameLoop();

</script>
</body>
</html>
